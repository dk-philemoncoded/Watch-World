<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHILL | World Watch & Planetary Timepiece</title>
  <meta name="description" content="Explore time across Earth on an analog luxury wrist watch by PHILL. Search any country, city, or town on the 3D globe to watch time and celestial atmosphere unfold.">
  
  <!-- Google Fonts: Luxury Serif & Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-night">

  <!-- Dynamic Atmospheric Background (Reflects local time of target location) -->
  <div id="sky-background">
    <div id="sun-moon-glow"></div>
    <div id="stars-layer"></div>
  </div>

  <!-- Animated Horizon & 2D Vector Human Activity Scenery -->
  <canvas id="horizon-canvas"></canvas>

  <div id="app-container">

    <!-- Site Header -->
    <header class="site-header">
      <div class="brand-badge">
        <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <div>
          <h1 class="brand-title">PHILL</h1>
          <p class="brand-tagline">Planetary Horology & World Time</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Sound Toggle -->
        <button id="sound-toggle-btn" class="icon-btn" aria-label="Toggle mechanical watch sound" title="Toggle Mechanical Audio">
          <span class="sound-icon">ON</span>
        </button>
      </div>
    </header>

    <!-- Search Section -->
    <section class="search-section">
      <div class="search-container">
        <form id="search-form" class="search-form" autocomplete="off">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="search-input" 
              class="search-input" 
              placeholder="Search any country, city, or town (e.g. Nigeria, Japan, Oxford, Paris)..." 
              aria-label="Search destination for time"
              spellcheck="false"
            >
            <button type="submit" class="search-submit-btn">
              <span>Find Time</span>
              <span class="btn-arrow">-&gt;</span>
            </button>
          </div>

          <!-- Autocomplete Dropdown -->
          <div id="suggestions-dropdown" class="suggestions-dropdown hidden"></div>
        </form>

        <!-- Quick Access Popular Locations -->
        <div class="popular-cities">
          <span class="popular-label">Popular:</span>
          <button type="button" class="city-chip" data-city="Nigeria">Nigeria</button>
          <button type="button" class="city-chip" data-city="Tokyo">Tokyo</button>
          <button type="button" class="city-chip" data-city="London">London</button>
          <button type="button" class="city-chip" data-city="New York">New York</button>
          <button type="button" class="city-chip" data-city="Paris">Paris</button>
          <button type="button" class="city-chip" data-city="Dubai">Dubai</button>
          <button type="button" class="city-chip" data-city="Sydney">Sydney</button>
          <button type="button" class="city-chip" data-city="Cairo">Cairo</button>
        </div>
      </div>
    </section>

    <!-- Hero Stage: The 3D Mechanical Buckled Wristwatch by PHILL -->
    <main id="hero-stage" class="hero-stage">
      
      <!-- Wrist Watch Container -->
      <div id="watch-wrapper" class="watch-wrapper">
        <canvas id="watch-3d-canvas" class="watch-3d-canvas" width="760" height="760"></canvas>
        <canvas id="watch-canvas" class="watch-canvas" width="760" height="760" style="display: none;"></canvas>
        <div id="watch-telemetry" class="watch-telemetry">CALIBRATING TIMEZONE...</div>
        <div class="watch-hint">Drag to rotate in 3D | Scroll to zoom | Buckled strap &amp; clasp | Hands reflect local time</div>
      </div>

    </main>

    <!-- Information Deck & Horological Complications -->
    <footer class="info-deck">
      
      <!-- Target Location Card -->
      <div class="location-card">
        <div class="card-header-tag">Target Location</div>
        <h2 id="location-name" class="location-name">--</h2>
        <div id="location-country" class="location-country">--</div>
        <div class="card-meta-pills">
          <span id="timezone-badge" class="meta-pill">UTC+0</span>
          <span id="coords-badge" class="meta-pill">0.00 N, 0.00 E</span>
        </div>
      </div>

      <!-- Digital Readout & Solar Day/Night Status -->
      <div class="time-card">
        <div class="card-header-tag">Local Time</div>
        <div class="time-display-wrapper">
          <div id="digital-time" class="digital-time">
            <span class="digit">12</span><span class="colon">:</span><span class="digit">00</span><span class="colon">:</span><span class="digit sec">00</span>
          </div>
          <span id="time-period" class="time-period">PM</span>
        </div>
        <div id="relative-time" class="relative-time">Calculating difference...</div>
        <div id="solar-status" class="solar-status">Daytime</div>
      </div>

      <!-- Watch Customizer (Case Finish) -->
      <div class="watch-customizer">
        <div class="customizer-title">Bezel & Case Finish</div>
        <div class="finish-options">
          <button type="button" class="finish-btn active" data-finish="gold" title="18ct Yellow Gold">
            <span class="finish-swatch swatch-gold"></span>
            <span>Yellow Gold</span>
          </button>
          <button type="button" class="finish-btn" data-finish="rose-gold" title="18ct Everose Gold">
            <span class="finish-swatch swatch-rosegold"></span>
            <span>Rose Gold</span>
          </button>
          <button type="button" class="finish-btn" data-finish="white-gold" title="18ct White Gold">
            <span class="finish-swatch swatch-whitegold"></span>
            <span>White Gold</span>
          </button>
          <button type="button" class="finish-btn" data-finish="platinum" title="950 Platinum">
            <span class="finish-swatch swatch-platinum"></span>
            <span>Platinum</span>
          </button>
        </div>
      </div>

    </footer>

  </div>

  <!-- Application Scripts (Unified Bundle for zero-dependency execution) -->
  <script src="bundle.js"></script>

</body>
</html>
